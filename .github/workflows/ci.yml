name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Install Linux tray dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features gui -- -D warnings
      - run: cargo test --locked --all-targets --features gui

  native:
    name: Native (${{ matrix.platform }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            arch: x86_64
            runner: ubuntu-24.04
            runner_arch: X64
            target: x86_64-unknown-linux-gnu
          - platform: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            target: aarch64-unknown-linux-gnu
          - platform: macOS
            arch: x86_64
            runner: macos-15-intel
            runner_arch: X64
            target: x86_64-apple-darwin
          - platform: macOS
            arch: ARM64
            runner: macos-15
            runner_arch: ARM64
            target: aarch64-apple-darwin
          - platform: Windows
            arch: x86_64
            runner: windows-latest
            runner_arch: X64
            target: x86_64-pc-windows-msvc
          - platform: Windows
            arch: ARM64
            runner: windows-11-arm
            runner_arch: ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Assert native target
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const expectedArch = "${{ matrix.runner_arch }}";
            const expectedTarget = "${{ matrix.target }}";

            if (process.env.RUNNER_ARCH !== expectedArch) {
              throw new Error(`Expected ${expectedArch} runner, got ${process.env.RUNNER_ARCH}`);
            }

            const version = execFileSync("rustc", ["-vV"], { encoding: "utf8" });
            const host = version.match(/^host: (.+)$/m)?.[1];
            if (host !== expectedTarget) {
              throw new Error(`Expected Rust host ${expectedTarget}, got ${host}`);
            }
            core.info(`Validated native ${expectedArch} runner for ${host}`);
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo build --locked --release --features gui --target ${{ matrix.target }}
      - run: cargo test --locked --all-targets --features gui --target ${{ matrix.target }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: quality-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            quality-${{ runner.os }}-
      - name: Install Linux tray dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features gui -- -D warnings
      - run: cargo test --locked --all-targets --features gui

  native:
    name: Native (${{ matrix.platform }} ${{ matrix.arch }})
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        include:
          - platform: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            target: aarch64-unknown-linux-gnu
          - platform: macOS
            arch: x86_64
            runner: macos-15-intel
            runner_arch: X64
            target: x86_64-apple-darwin
          - platform: macOS
            arch: ARM64
            runner: macos-15
            runner_arch: ARM64
            target: aarch64-apple-darwin
          - platform: Windows
            arch: x86_64
            runner: windows-latest
            runner_arch: X64
            target: x86_64-pc-windows-msvc
          - platform: Windows
            arch: ARM64
            runner: windows-11-arm
            runner_arch: ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            native-${{ matrix.target }}-
      - name: Assert native target (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$EXPECTED_TARGET"
      - name: Assert native target (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          if ($env:RUNNER_ARCH -ne $env:EXPECTED_ARCH) { throw "Expected $env:EXPECTED_ARCH runner, got $env:RUNNER_ARCH" }
          $hostTarget = ((rustc -vV | Select-String '^host: ').ToString() -replace '^host: ', '').Trim()
          if ($hostTarget -ne $env:EXPECTED_TARGET) { throw "Expected $env:EXPECTED_TARGET Rust host, got $hostTarget" }
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo test --locked --all-targets --features gui --target ${{ matrix.target }}

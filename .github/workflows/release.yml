name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - id: classify
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must be semantic versions, for example v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi

          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.asset }}
    needs: validate-tag
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            runner_arch: X64
            target: x86_64-unknown-linux-gnu
            asset: x86_64-unknown-linux-gnu
            extension: tar.gz
            archive: tar
          - os: ubuntu-24.04-arm
            runner_arch: ARM64
            target: aarch64-unknown-linux-gnu
            asset: aarch64-unknown-linux-gnu
            extension: tar.gz
            archive: tar
          - os: macos-15-intel
            runner_arch: X64
            target: x86_64-apple-darwin
            asset: x86_64-apple-darwin
            extension: dmg
            archive: dmg
          - os: macos-15
            runner_arch: ARM64
            target: aarch64-apple-darwin
            asset: aarch64-apple-darwin
            extension: dmg
            archive: dmg
          - os: windows-latest
            runner_arch: X64
            target: x86_64-pc-windows-msvc
            asset: x86_64-pc-windows-msvc
            extension: zip
            archive: zip
          - os: windows-11-arm
            runner_arch: ARM64
            target: aarch64-pc-windows-msvc
            asset: aarch64-pc-windows-msvc
            extension: zip
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-
      - name: Assert native target (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$EXPECTED_TARGET"
      - name: Assert native target (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          if ($env:RUNNER_ARCH -ne $env:EXPECTED_ARCH) { throw "Expected $env:EXPECTED_ARCH runner, got $env:RUNNER_ARCH" }
          $hostTarget = ((rustc -vV | Select-String '^host: ').ToString() -replace '^host: ', '').Trim()
          if ($hostTarget -ne $env:EXPECTED_TARGET) { throw "Expected $env:EXPECTED_TARGET Rust host, got $hostTarget" }
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo build --locked --release --features gui --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/edgesteer dist/edgesteer
          cp target/${{ matrix.target }}/release/edgesteer-ui dist/edgesteer-ui
          cp README.md config.example.json LICENSE dist/
          cp -R docs dist/docs
          tar -C dist -czf EdgeSteer-${{ matrix.asset }}.tar.gz .
      - name: Package macOS disk image
        if: matrix.archive == 'dmg'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./packaging/macos/build-dmg.sh \
            "${{ matrix.target }}" \
            "${VERSION#v}" \
            "EdgeSteer-${{ matrix.asset }}.dmg"
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/edgesteer.exe" "dist/edgesteer.exe"
          Copy-Item "target/${{ matrix.target }}/release/edgesteer-ui.exe" "dist/edgesteer-ui.exe"
          Copy-Item README.md, config.example.json, LICENSE dist/
          Copy-Item docs "dist/docs" -Recurse
          Compress-Archive -Path dist/* -DestinationPath "EdgeSteer-${{ matrix.asset }}.zip" -Force
      - uses: actions/upload-artifact@v5
        with:
          name: edgesteer-${{ matrix.asset }}
          path: EdgeSteer-${{ matrix.asset }}.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6
          args=(--generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create --repo "$GH_REPO" "${GITHUB_REF_NAME}" "${args[@]}" release-assets/*

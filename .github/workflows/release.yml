name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - id: classify
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must be semantic versions, for example v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi

          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.asset }}
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner_arch: X64
            target: x86_64-unknown-linux-gnu
            asset: x86_64-unknown-linux-gnu
            extension: tar.gz
            archive: tar
          - os: ubuntu-24.04-arm
            runner_arch: ARM64
            target: aarch64-unknown-linux-gnu
            asset: aarch64-unknown-linux-gnu
            extension: tar.gz
            archive: tar
          - os: macos-15-intel
            runner_arch: X64
            target: x86_64-apple-darwin
            asset: x86_64-apple-darwin
            extension: dmg
            archive: dmg
          - os: macos-15
            runner_arch: ARM64
            target: aarch64-apple-darwin
            asset: aarch64-apple-darwin
            extension: dmg
            archive: dmg
          - os: windows-latest
            runner_arch: X64
            target: x86_64-pc-windows-msvc
            asset: x86_64-pc-windows-msvc
            extension: zip
            archive: zip
          - os: windows-11-arm
            runner_arch: ARM64
            target: aarch64-pc-windows-msvc
            asset: aarch64-pc-windows-msvc
            extension: zip
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Assert native target
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const expectedArch = "${{ matrix.runner_arch }}";
            const expectedTarget = "${{ matrix.target }}";

            if (process.env.RUNNER_ARCH !== expectedArch) {
              throw new Error(`Expected ${expectedArch} runner, got ${process.env.RUNNER_ARCH}`);
            }

            const version = execFileSync("rustc", ["-vV"], { encoding: "utf8" });
            const host = version.match(/^host: (.+)$/m)?.[1];
            if (host !== expectedTarget) {
              throw new Error(`Expected Rust host ${expectedTarget}, got ${host}`);
            }
            core.info(`Validated native ${expectedArch} runner for ${host}`);
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo build --locked --release --features gui --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/edgesteer dist/edgesteer
          cp target/${{ matrix.target }}/release/edgesteer-ui dist/edgesteer-ui
          cp README.md config.example.json LICENSE dist/
          cp -R docs dist/docs
          tar -C dist -czf EdgeSteer-${{ matrix.asset }}.tar.gz .
      - name: Package macOS disk image
        if: matrix.archive == 'dmg'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./packaging/macos/build-dmg.sh \
            "${{ matrix.target }}" \
            "${VERSION#v}" \
            "EdgeSteer-${{ matrix.asset }}.dmg"
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/edgesteer.exe" "dist/edgesteer.exe"
          Copy-Item "target/${{ matrix.target }}/release/edgesteer-ui.exe" "dist/edgesteer-ui.exe"
          Copy-Item README.md, config.example.json, LICENSE dist/
          Copy-Item docs "dist/docs" -Recurse
          Compress-Archive -Path dist/* -DestinationPath "EdgeSteer-${{ matrix.asset }}.zip" -Force
      - uses: actions/upload-artifact@v5
        with:
          name: edgesteer-${{ matrix.asset }}
          path: EdgeSteer-${{ matrix.asset }}.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          args=(--generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" release-assets/*

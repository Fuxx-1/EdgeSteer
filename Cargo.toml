[package]
name = "edgesteer"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Adaptive DNS steering for preferred Cloudflare edge IPs"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Fuxx-1/EdgeSteer"
homepage = "https://github.com/Fuxx-1/EdgeSteer"
keywords = ["dns", "cloudflare", "cdn", "doh", "dot"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = []
gui = ["dep:iced", "dep:iced_aw", "dep:png", "dep:tray-icon", "dep:winit"]

[[bin]]
name = "edgesteer-ui"
path = "src/bin/edgesteer-ui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
hickory-proto = "0.25"
ipnet = "2.11"
notify = "8.0"
rand = "0.9"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "0.26"
iced = { version = "0.12.1", optional = true, features = ["image", "tokio"] }
iced_aw = { version = "0.9.3", default-features = false, features = ["floating_element", "modal"], optional = true }
png = { version = "0.18", optional = true }
winit = { version = "0.29.15", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.24.1", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.24.1", default-features = false, features = ["gtk"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSRunningApplication"] }
system-configuration = "0.7"

[target.'cfg(windows)'.dependencies]
ipconfig = { version = "0.3.4", default-features = false }

[dev-dependencies]
tempfile = "3.15"
